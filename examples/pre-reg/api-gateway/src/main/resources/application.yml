logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.jwt: TRACE
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.server: DEBUG
    com.example.apigateway: DEBUG  # Your package

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/fido-connector-dev
  
  cloud:
    gateway:
      globalcors:
        default-filters:
        - TokenRelay
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/api/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5175"
              - "http://localhost:5174"
            allowedMethods:
              - GET
              - POST
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
            allowCredentials: true
      routes:
        # Address validation (USED)
        - id: validate-address
          uri: https://iap-piercer.graywave-eec1246c.westus2.azurecontainerapps.io
          predicates:
            - Path=/api/addresses/validate
          filters:
            - SetRequestHeader=Authorization, Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJodHRwczovL2FwaS5jb25zb2xlLmRldi55dWJpY28uY29tIiwiZXhwIjoxNzkyODczMjczLCJpYXQiOjE3NjEzMzcyNzMsImp0aSI6IlB3UXZxd1pScDFRcVlUWERuYXRhcFoiLCJvcmciOiJHR1FmcUI2UnhTbzNZR3hGTFZZeExzIiwic3ViIjoiTFhCTGNpQ0hNQ3U5ZnJBZlA3Y1dyWiIsInZlciI6InYyIn0.3-0H55SGztCHctxL_J6fu4SUnJ54y6FyBplvQ2DmoVg
            - RewritePath=/api/addresses/validate,/v1/validate-address
            - AddResponseHeader=X-Gateway-Transformed, true

        - id: countries-list
          uri: https://iap-piercer.graywave-eec1246c.westus2.azurecontainerapps.io
          predicates:
            - Path=/api/countries
          filters:
            - SetRequestHeader=Authorization, Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJodHRwczovL2FwaS5jb25zb2xlLmRldi55dWJpY28uY29tIiwiZXhwIjoxNzkyODczMjczLCJpYXQiOjE3NjEzMzcyNzMsImp0aSI6IlB3UXZxd1pScDFRcVlUWERuYXRhcFoiLCJvcmciOiJHR1FmcUI2UnhTbzNZR3hGTFZZeExzIiwic3ViIjoiTFhCTGNpQ0hNQ3U5ZnJBZlA3Y1dyWiIsInZlciI6InYyIn0.3-0H55SGztCHctxL_J6fu4SUnJ54y6FyBplvQ2DmoVg
            - RewritePath=/api/countries,/v1/countries
            - AddResponseHeader=X-Gateway-Transformed, true

        - id: create-shipment
          uri: ${FIDO_CONNECTOR_URL:http://localhost:8080}
          predicates:
            - Path=/api/shipments
          filters:
            - TokenRelay
            - RewritePath=/api/shipments,/v1/fpr/shipments

server:
  port: 8086