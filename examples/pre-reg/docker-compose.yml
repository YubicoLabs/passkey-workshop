# Pre-Registration Reference Architecture
# Usage: cp default.env .env && ./deploy.sh

services:
  client:
    build: ./client
    container_name: pre-reg-client
    depends_on:
      - gateway
    ports:
      - "${CLIENT_PORT:-80}:80"
    environment:
      VITE_OIDC_AUTHORITY: ${KEYCLOAK_URL:-http://localhost:8082}/realms/pre-reg
      VITE_OIDC_CLIENT_ID: pre-reg-client
      VITE_API_BASE_URL: ${GATEWAY_URL:-http://localhost:8086}

  gateway:
    build: ./api-gateway
    container_name: pre-reg-gateway
    depends_on:
      - keycloak
    ports:
      - "${GATEWAY_PORT:-8086}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      OIDC_ISSUER_URI: ${KEYCLOAK_URL:-http://localhost:8082}/realms/pre-reg
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/pre-reg/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ADDRESS_VALIDATION_SERVICE_URL: ${ADDRESS_VALIDATION_SERVICE_URL:-https://iap-piercer.graywave-eec1246c.westus2.azurecontainerapps.io}
      DOWNSTREAM_API_TOKEN: ${DOWNSTREAM_API_TOKEN}

  keycloak:
    build: ./keycloak
    container_name: pre-reg-keycloak
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_URL: ${KEYCLOAK_URL:-http://localhost:8082}
      KC_HOSTNAME_ADMIN_URL: ${KEYCLOAK_URL:-http://localhost:8082}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data:
